<!-- XRP token, built from the supplied render: brushed green metal, milled edge,
     engraved double ring, embossed XRP mark and wordmark. Colours sampled from
     that file (#76b988 lit face through #1f321e in shadow). -->
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1100" viewBox="0 0 2000 1100" fill="none">
  <defs>
    <linearGradient id="xrp-bezel" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#a8dcb4"/>
      <stop offset="18%" stop-color="#7cc08c"/>
      <stop offset="46%" stop-color="#3d7a49"/>
      <stop offset="70%" stop-color="#2a5c33"/>
      <stop offset="88%" stop-color="#4a8a58"/>
      <stop offset="100%" stop-color="#8fcc9d"/>
    </linearGradient>
    <linearGradient id="xrp-side" x1="0" y1="0" x2="0.9" y2="0.6">
      <stop offset="0%" stop-color="#8ec79b"/>
      <stop offset="34%" stop-color="#4c8659"/>
      <stop offset="72%" stop-color="#27512e"/>
      <stop offset="100%" stop-color="#16321c"/>
    </linearGradient>
    <linearGradient id="xrp-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a5c33"/>
      <stop offset="100%" stop-color="#16321c"/>
    </linearGradient>
    <!-- brushed face: lit from the upper left, falling into shadow bottom-right -->
    <linearGradient id="xrp-face" x1="0.18" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#8fcc9e"/>
      <stop offset="26%" stop-color="#76b988"/>
      <stop offset="58%" stop-color="#4a8a58"/>
      <stop offset="82%" stop-color="#2f6138"/>
      <stop offset="100%" stop-color="#1f3f25"/>
    </linearGradient>
    <linearGradient id="xrp-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="xrp-bandclip">
      <path d="M 0 -104 A 89.4 104 0 0 0 0 104 L -34 104 A 89.4 104 0 0 1 -34 -104 Z"/>
    </clipPath>
  </defs>

  <g transform="translate(565 528) rotate(-4)">
    <ellipse cx="-34" rx="89.4" ry="104" fill="url(#xrp-back)"/>
    <path d="M 0 -104 A 89.4 104 0 0 0 0 104 L -34 104 A 89.4 104 0 0 1 -34 -104 Z" fill="url(#xrp-side)"/>

    <!-- milling on the exposed edge -->
    <g clip-path="url(#xrp-bandclip)" stroke="#16321c" stroke-opacity="0.45" stroke-width="1.6">
      <path d="M-88 -96 h -34"/><path d="M-88 -88 h -34"/><path d="M-88 -80 h -34"/>
      <path d="M-88 -72 h -34"/><path d="M-88 -64 h -34"/><path d="M-88 -56 h -34"/>
      <path d="M-88 -48 h -34"/><path d="M-88 -40 h -34"/><path d="M-88 -32 h -34"/>
      <path d="M-88 -24 h -34"/><path d="M-88 -16 h -34"/><path d="M-88 -8 h -34"/>
      <path d="M-88 0 h -34"/><path d="M-88 8 h -34"/><path d="M-88 16 h -34"/>
      <path d="M-88 24 h -34"/><path d="M-88 32 h -34"/><path d="M-88 40 h -34"/>
      <path d="M-88 48 h -34"/><path d="M-88 56 h -34"/><path d="M-88 64 h -34"/>
      <path d="M-88 72 h -34"/><path d="M-88 80 h -34"/><path d="M-88 88 h -34"/>
      <path d="M-88 96 h -34"/>
    </g>

    <ellipse rx="89.4" ry="104" fill="url(#xrp-bezel)"/>
    <ellipse rx="79" ry="92" fill="url(#xrp-face)"/>

    <!-- engraved double ring -->
    <ellipse rx="73" ry="85" fill="none" stroke="#16321c" stroke-opacity="0.35" stroke-width="2"/>
    <ellipse rx="70" ry="81.5" fill="none" stroke="#a8dcb4" stroke-opacity="0.35" stroke-width="1.6"/>
    <ellipse rx="62" ry="72" fill="none" stroke="#16321c" stroke-opacity="0.25" stroke-width="1.6"/>

    <!-- XRP mark and wordmark, embossed: dark relief under a lit face -->
    <g transform="scale(0.86 1)">
      <g stroke-linejoin="round" fill="none">
        <g transform="translate(3 4)" stroke="#16321c" stroke-opacity="0.55" stroke-width="15">
          <path d="M-46 -40 L0 2 L46 -40"/>
          <path d="M-46 40 L0 -2 L46 40"/>
        </g>
        <g transform="translate(-2 -2)" stroke="#a8dcb4" stroke-opacity="0.5" stroke-width="15">
          <path d="M-46 -40 L0 2 L46 -40"/>
          <path d="M-46 40 L0 -2 L46 40"/>
        </g>
        <g stroke="#6cac7a" stroke-width="15">
          <path d="M-46 -40 L0 2 L46 -40"/>
          <path d="M-46 40 L0 -2 L46 40"/>
        </g>
      </g>
      <rect x="30" y="-4" width="9" height="9" fill="none" stroke="#a8dcb4" stroke-opacity="0.6" stroke-width="2.5"/>

      <text y="70" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="28"
            font-weight="700" letter-spacing="2" fill="#16321c" opacity="0.5"
            transform="translate(2 3)">XRP</text>
      <text y="70" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="28"
            font-weight="700" letter-spacing="2" fill="#9fd6ae">XRP</text>
    </g>

    <path d="M-64 -56 A 86 100 0 0 1 32 -92" stroke="url(#xrp-sheen)" stroke-width="10"
          fill="none" stroke-linecap="round"/>
    <path d="M52 76 A 86 100 0 0 0 82 26" stroke="#c8ecd2" stroke-opacity="0.4" stroke-width="6"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
