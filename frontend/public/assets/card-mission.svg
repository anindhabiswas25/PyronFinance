<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" fill="none">
  <style>
    .bar { transform-origin: 50% 100%; animation: grow 3.6s ease-in-out infinite; }
    @keyframes grow { 0%,100% { transform: scaleY(.68) } 50% { transform: scaleY(1) } }
    .halo { animation: halo 4s ease-in-out infinite; transform-origin: 300px 330px; }
    @keyframes halo { 0%,100% { opacity: .25; transform: scale(1) } 50% { opacity: .5; transform: scale(1.08) } }
  </style>
  <defs>
    <radialGradient id="cm-halo" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#0066ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle class="halo" cx="300" cy="330" r="230" fill="url(#cm-halo)"/>
  <g>
    <rect class="bar" x="150" y="230" width="34" height="100" rx="17" fill="#0066ff" opacity="0.35" style="animation-delay:.2s"/>
    <rect class="bar" x="204" y="196" width="34" height="134" rx="17" fill="#0066ff" opacity="0.5" style="animation-delay:.5s"/>
    <rect class="bar" x="258" y="160" width="34" height="170" rx="17" fill="#0066ff" opacity="0.7" style="animation-delay:.8s"/>
    <rect class="bar" x="312" y="124" width="34" height="206" rx="17" fill="#0066ff" style="animation-delay:1.1s"/>
    <rect class="bar" x="366" y="92" width="34" height="238" rx="17" fill="#0defd1" style="animation-delay:1.4s"/>
  </g>
  <rect x="120" y="330" width="360" height="2" rx="1" fill="#e2e8f0"/>
</svg>
