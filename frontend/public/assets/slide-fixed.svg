<svg xmlns="http://www.w3.org/2000/svg" width="760" height="835" viewBox="0 0 760 835" fill="none">
  <style>
    .ring { animation: ring 5s ease-in-out infinite; }
    @keyframes ring { 0% { stroke-dashoffset: 880 } 60%,100% { stroke-dashoffset: 190 } }
    .tick { animation: tick 3s steps(1) infinite; }
    @keyframes tick { 0%,49% { opacity: 1 } 50%,100% { opacity: .35 } }
    .drip { animation: drip 3s ease-in-out infinite; }
    @keyframes drip { 0% { transform: translateY(0); opacity: 0 } 25% { opacity: 1 } 100% { transform: translateY(40px); opacity: 0 } }
  </style>
  <rect width="760" height="835" fill="#010320"/>
  <circle cx="380" cy="330" r="290" fill="#0066ff" opacity="0.16"/>

  <rect x="70" y="120" width="620" height="600" rx="40" fill="#ffffff" fill-opacity="0.06"
        stroke="#ffffff" stroke-opacity="0.16"/>

  <text x="112" y="188" font-family="'Plus Jakarta Sans',sans-serif" font-size="26" font-weight="600" fill="#ffffff">Fixed position</text>

  <g transform="translate(380 372)">
    <circle r="140" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="18"/>
    <circle class="ring" r="140" fill="none" stroke="#0defd1" stroke-width="18" stroke-linecap="round"
            stroke-dasharray="880" stroke-dashoffset="880" transform="rotate(-90)"/>
    <text y="-4" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="54" font-weight="600" fill="#ffffff">7.42%</text>
    <text y="34" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#ffffff" opacity="0.55">locked to maturity</text>
  </g>

  <g class="drip">
    <circle cx="380" cy="548" r="6" fill="#0defd1"/>
  </g>

  <g font-family="Inter,sans-serif" font-size="18" fill="#ffffff">
    <rect x="112" y="590" width="256" height="106" rx="26" fill="#ffffff" fill-opacity="0.08"/>
    <text x="144" y="632" opacity="0.55">Days to maturity</text>
    <text class="tick" x="144" y="670" font-family="'Plus Jakarta Sans',sans-serif" font-size="30" font-weight="600">154</text>

    <rect x="392" y="590" width="256" height="106" rx="26" fill="#ffffff" fill-opacity="0.08"/>
    <text x="424" y="632" opacity="0.55">Yield claimed</text>
    <text class="tick" x="424" y="670" font-family="'Plus Jakarta Sans',sans-serif" font-size="30"
          font-weight="600" fill="#0defd1" style="animation-delay:1.4s">312.8</text>
  </g>
</svg>
