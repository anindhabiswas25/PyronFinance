<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" fill="none">
  <style>
    .t { animation: travel 3.2s linear infinite; }
    .t2 { animation: travel 3.2s linear infinite; animation-delay: 1.1s; }
    .t3 { animation: travel 3.2s linear infinite; animation-delay: 2.2s; }
    @keyframes travel { 0% { offset-distance: 0%; opacity: 0 } 12% { opacity: 1 } 88% { opacity: 1 } 100% { offset-distance: 100%; opacity: 0 } }
  </style>
  <g stroke="#e2e8f0" stroke-width="2" fill="none">
    <path id="r1" d="M40 300 H 240 Q 300 300 300 240 V 120 Q 300 60 360 60 H 560"/>
    <path d="M40 220 H 200 Q 260 220 260 160 V 120"/>
    <path d="M560 220 H 400 Q 340 220 340 170"/>
    <path d="M40 140 H 130 Q 170 140 170 100 V 40"/>
    <path d="M560 320 H 430 Q 380 320 380 270"/>
  </g>
  <g fill="#e2e8f0">
    <circle cx="40" cy="300" r="4"/><circle cx="40" cy="220" r="4"/>
    <circle cx="560" cy="220" r="4"/><circle cx="560" cy="320" r="4"/>
    <circle cx="170" cy="40" r="4"/>
  </g>
  <g fill="#0066ff">
    <circle r="6" class="t" style="offset-path: path('M40 300 H 240 Q 300 300 300 240 V 120 Q 300 60 360 60 H 560')"/>
    <circle r="6" class="t2" style="offset-path: path('M40 300 H 240 Q 300 300 300 240 V 120 Q 300 60 360 60 H 560')"/>
    <circle r="5" fill="#0defd1" class="t3" style="offset-path: path('M40 220 H 200 Q 260 220 260 160 V 120')"/>
  </g>
  <g>
    <circle cx="300" cy="120" r="26" fill="#0066ff" opacity="0.12"/>
    <circle cx="300" cy="120" r="10" fill="#0066ff"/>
  </g>
</svg>
