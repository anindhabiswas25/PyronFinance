<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1100" viewBox="0 0 2000 1100" fill="none">
  <defs>
    <!-- polished chrome bezel: key light top-left, bounce light bottom-right -->
    <linearGradient id="yt-bezel" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="16%" stop-color="#dff0ff"/>
      <stop offset="40%" stop-color="#7fa8cc"/>
      <stop offset="56%" stop-color="#eaf6ff"/>
      <stop offset="76%" stop-color="#7fa8cc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="yt-side" x1="0" y1="0" x2="1" y2="0.55">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="30%" stop-color="#a8cbe4"/>
      <stop offset="66%" stop-color="#3f7f9e"/>
      <stop offset="100%" stop-color="#1d4f66"/>
    </linearGradient>
    <radialGradient id="yt-face" cx="30%" cy="20%" r="92%">
      <stop offset="0%" stop-color="#7fe6c4"/>
      <stop offset="46%" stop-color="#22b894"/>
      <stop offset="100%" stop-color="#0a6a68"/>
    </radialGradient>
    <linearGradient id="yt-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f7f9e"/>
      <stop offset="100%" stop-color="#1d4f66"/>
    </linearGradient>
    <linearGradient id="yt-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="yt-bandclip"><path d="M 0 -104.0 A 89.4 104.0 0 0 0 0 104.0 L -36.0 104.0 A 89.4 104.0 0 0 1 -36.0 -104.0 Z"/></clipPath>
  </defs>

  <g transform="translate(1150 258) rotate(20)">
    <ellipse cx="-36" rx="89.4" ry="104.0" fill="url(#yt-back)"/>
    <path d="M 0 -104.0 A 89.4 104.0 0 0 0 0 104.0 L -36.0 104.0 A 89.4 104.0 0 0 1 -36.0 -104.0 Z" fill="url(#yt-side)"/>
    <path d="M 0 -104.0 A 89.4 104.0 0 0 0 0 104.0 L -36.0 104.0 A 89.4 104.0 0 0 1 -36.0 -104.0 Z" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.4"/>

    <ellipse rx="89.4" ry="104.0" fill="url(#yt-bezel)"/>
    <ellipse rx="76.9" ry="89.4" fill="url(#yt-face)"/>
    <ellipse rx="76.9" ry="89.4" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>

    <g transform="scale(0.86 1)">
      <text y="26" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif"
            font-size="82" font-weight="700" letter-spacing="-2" fill="#0a6a68" opacity="0.3"
            transform="translate(3 5)">YT</text>
      <text y="26" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif"
            font-size="82" font-weight="700" letter-spacing="-2" fill="#ffffff">YT</text>
      <ellipse rx="74" ry="74" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
    </g>

    <path d="M -66.2 -58.2 A 85.0 98.8 0 0 1 32.2 -93.6"
          stroke="url(#yt-sheen)" stroke-width="10.4" fill="none" stroke-linecap="round"/>
    <path d="M 53.7 74.9 A 85.0 98.8 0 0 0 83.2 29.1"
          stroke="#ffffff" stroke-opacity="0.4" stroke-width="6.2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
